<!doctype html><html><meta charset="utf-8"><title>KineNest world theme regression</title>
<pre id="result">RUNNING</pre><img src="/hold" alt=""><iframe width="1440" height="1100"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),out=document.getElementById('result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
async function until(predicate){for(let i=0;i<200;i++){if(predicate())return;await wait(50);}throw Error('Page readiness timeout');}
async function load(page){frame.src='../'+page;await new Promise(resolve=>frame.onload=resolve);await until(()=>frame.contentDocument?.getElementById('theme')&&frame.contentDocument?.getElementById('check')?.disabled===false);return frame.contentDocument;}
const rgb=value=>value.match(/[\d.]+/g).slice(0,3).map(Number);
const luminance=color=>rgb(color).map(n=>{n/=255;return n<=.04045?n/12.92:((n+.055)/1.055)**2.4;}).reduce((sum,n,i)=>sum+n*[.2126,.7152,.0722][i],0);
const contrast=(a,b)=>{const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);};
try{
 localStorage.setItem('ros2learn-theme','dark');localStorage.setItem('ros2learn-language','en');
 let d=await load('index.html');const style=el=>frame.contentWindow.getComputedStyle(el);
 d.getElementById('theme').click();
 assert(d.documentElement.dataset.theme==='light','Session 1 theme');
 assert(style(d.querySelector('.world-background')).fill==='rgb(255, 255, 255)','Session 1 world is not white');
 assert(style(d.querySelector('.world-grid')).stroke==='rgb(213, 224, 229)','Session 1 grid not themed');
 assert(contrast(style(d.querySelector('.world-caption')).fill,'rgb(255, 255, 255)')>=4.5,'Session 1 caption contrast');
 d=await load('index.html');assert(d.documentElement.dataset.theme==='light','Theme preference lost on navigation');
 d.getElementById('theme').click();assert(style(d.querySelector('.world-background')).fill==='rgb(11, 27, 37)','Session 1 dark restore');
 for(const session of [2,3,4,5,6]){
  d=await load('session-0'+session+'.html');const $=id=>d.getElementById(id);
  const map=$('map'),pixel=()=>[...map.getContext('2d').getImageData(0,0,1,1).data];
  await until(()=>pixel()[3]===255);
  const draft='# Theme switch keeps this student draft';$('python-code').value=draft;
  const lesson=$('lesson-select').value,camera=$('camera').toDataURL(),pose=$('pose').textContent;
  $('theme').click();
  assert(pixel().join(',')==='255,255,255,255','Session '+session+' Canvas is not white immediately');
  assert($('camera').toDataURL()===camera,'Theme changed camera pixels in Session '+session);
  assert($('python-code').value===draft&&$('lesson-select').value===lesson&&$('pose').textContent===pose,'Theme changed exercise state');
  if(session>=5){
   const caption=style(d.querySelector('.frame-label')),axisX=style(d.querySelector('.axis-x')),axisY=style(d.querySelector('.axis-y'));
   assert(contrast(caption.fill,'rgb(255, 255, 255)')>=4.5,'TF label contrast');
   assert(caption.stroke==='rgb(255, 255, 255)','TF label halo should be white');
   assert(contrast(axisX.stroke,'rgb(255, 255, 255)')>=3&&contrast(axisY.stroke,'rgb(255, 255, 255)')>=3,'TF axis contrast');
   assert(style($('tf-vector')).stroke===style(d.querySelector('.relative-arrow')).fill,'TF arrowhead mismatch');
  }
  $('theme').click();assert(pixel().join(',')==='11,27,37,255','Session '+session+' Canvas dark restore');
  assert($('camera').toDataURL()===camera,'Dark restore changed camera pixels');
  if(session===5){
   const terminal=d.querySelector('.terminal');terminal.querySelector('input').value='ros2 topic pub --rate 10 /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.3}}"';terminal.querySelector('form').requestSubmit();
   const x=()=>Number($('tf-spatial').querySelector('[data-frame="base_link"]').dataset.x);
   const before=x();await until(()=>x()>before+.05);const moving=x();$('theme').click();
   // The previous overlay can lag the current pose by one sensor period.
   assert(x()>=moving&&x()-moving<=.3/5+1e-6,'Theme broke base_link continuity');await until(()=>x()>moving+.05);
   assert(terminal.querySelector('input').readOnly,'Theme stopped publishing');
   $('reset').click();$('theme').click();
  }
 }
 out.textContent='PASS: white SVG/Canvas worlds in all six sessions, readable grids/TF, unchanged camera pixels and drafts, continuous robot motion, dark restore and persisted theme';
}catch(error){out.textContent='FAIL: '+error.message;}
await fetch('/done',{method:'POST',body:out.textContent});
</script></html>
