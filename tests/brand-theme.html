<!doctype html><meta charset="utf-8"><img src="/hold" hidden alt=""><pre id="result">RUNNING</pre><iframe width="1440" height="1100" src="../about.html"></iframe><script type="module">
const f=document.querySelector('iframe'),out=document.getElementById('result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(v,m)=>{if(!v)throw Error(m);};async function until(fn){for(let i=0;i<150;i++){if(fn())return;await wait(100);}throw Error('Page/image timeout');}
try{await until(()=>f.contentDocument?.getElementById('theme'));const d=f.contentDocument,w=f.contentWindow,images=[...d.querySelectorAll('.brand-full img')];await until(()=>images.length===2&&images.every(i=>i.complete&&i.naturalWidth));const pixels={};
for(const theme of ['light','dark','light']){if(d.documentElement.dataset.theme!==theme)d.getElementById('theme').click();const visible=images.filter(i=>w.getComputedStyle(i).display!=='none');assert(visible.length===1&&visible[0].src.endsWith('kinenest-logo-'+theme+'.png'),'Active theme logo');assert(w.getComputedStyle(visible[0]).filter==='none','Logo inverted');assert(d===f.contentDocument,'Theme reloaded page');const c=d.createElement('canvas');c.width=visible[0].naturalWidth;c.height=visible[0].naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(visible[0],0,0);const at=(x,y)=>[...ctx.getImageData(Math.round(x*c.width/1254),Math.round(y*c.width/1254),1,1).data];assert(at(10,10)[3]===0,'Opaque rectangular backdrop');pixels[theme]={red:at(680,590),green:at(627,535),ink:at(145,895)};assert(pixels[theme].red[0]>180&&pixels[theme].red[1]<130,'Red x-axis lost');assert(pixels[theme].green[1]>110&&pixels[theme].green[0]<100,'Green y-axis lost');}
assert(JSON.stringify(pixels.light.red)===JSON.stringify(pixels.dark.red)&&JSON.stringify(pixels.light.green)===JSON.stringify(pixels.dark.green),'Axes recoloured');assert(pixels.dark.ink[0]>200&&pixels.light.ink[0]<80,'Wordmark theme contrast');assert(d.querySelector('[data-product-tagline]').textContent==='A safe place to learn robotics by making things move.','Final tagline');
for(const width of [1440,800]){f.width=width;await wait(100);assert(d.documentElement.scrollWidth<=w.innerWidth,'About overflow');}out.textContent='PASS: explicit theme switches logo immediately, transparent background, preserved red/green axes, readable wordmark, final tagline and responsive About';}catch(e){out.textContent='FAIL: '+e.message;}await fetch('/done',{method:'POST',body:out.textContent});
</script>
