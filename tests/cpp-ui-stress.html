<!doctype html><meta charset="utf-8"><title>C++ UI output and compile cancellation</title>
<img src="/hold" hidden alt=""><pre id="result">RUNNING</pre><iframe src="../session-02.html" width="1440" height="1100" title="C++ UI under stress"></iframe>
<script type="module">
const f=document.querySelector('iframe'),out=document.getElementById('result'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
let d,$,observer,maxOutput=0;const results=[];
async function until(predicate,seconds=120,label='state'){const end=performance.now()+seconds*1000;while(performance.now()<end){if(predicate())return;await wait(20);}throw Error('Timeout '+label+' · '+$('python-state').textContent+' · '+$('python-output').textContent.slice(-800));}
async function progress(row){results.push(row);await fetch('/progress',{method:'POST',body:JSON.stringify(row)});}
try{
 await until(()=>f.contentDocument?.body?.dataset.lessonState==='ready'&&f.contentDocument.documentElement.dataset.kinenestBoot==='ready');
 d=f.contentDocument;$=id=>d.getElementById(id);const win=f.contentWindow;
 assert(d.body.dataset.lessonId==='session-02-01-subscriber','Ordinary public URL must load the default Core lesson');
 assert(new URL(win.location.href).searchParams.get('lesson')===d.body.dataset.lessonId,'Stress lesson URL must identify the selected exercise');
 d.querySelector('[data-code-language="compare"]').click();
 $('python-code').value='# retained Python stress-test draft';$('python-code').dispatchEvent(new win.Event('input',{bubbles:true}));
 const initialPose=$('pose').textContent,baselineGraph=$('graph').textContent;
 observer=new MutationObserver(()=>{maxOutput=Math.max(maxOutput,$('python-output').textContent.length);});
 observer.observe($('python-output'),{childList:true,characterData:true,subtree:true});
 const setCode=code=>{$('cpp-code').value=code;$('cpp-code').dispatchEvent(new win.Event('input',{bubbles:true}));};
 const kept=code=>assert($('cpp-code').value===code&&$('python-code').value==='# retained Python stress-test draft','Stress lost a student draft');
 const clean=async()=>{await until(()=>$('stop-python').disabled&&$('graph').textContent===baselineGraph,6,'graph cleanup');assert($('pose').textContent===initialPose,'Stress moved the robot');};
 const response=await fetch('./cpp/course/session-02-01-subscriber.cpp');assert(response.ok,'Reference unavailable');const reference=await response.text();
 const logCode='#include <rclcpp/rclcpp.hpp>\n#include <cstdio>\nint main(){rclcpp::init(); auto node=std::make_shared<rclcpp::Node>("output_stress"); for(int i=0;i<1000;++i) std::printf("LOG%04d '+ 'x'.repeat(700)+'\\n",i); std::fflush(stdout); rclcpp::spin(node);}\n';
 setCode(logCode);$('run-cpp').click();await until(()=>$('python-state').textContent.includes('callbacks ready'),120,'1000 actual log lines');
 await wait(100);const logLength=$('python-output').textContent.length;
 assert(logLength===24000&&maxOutput<=24000,'Log output exceeded or failed to exercise the 24000-character bound');
 assert($('python-output').childElementCount===0,'Log output created unbounded DOM elements');
 assert($('python-output').textContent.includes('LOG'),'Real compiled log output missing');kept(logCode);
 // The production worker caps output at 40 lines/s. It must not display all 1000 lines.
 await progress({case:'1000 real log lines',result:'PASS',retainedCharacters:logLength,maximumObservedCharacters:maxOutput,rateLimit:'40 lines/s; dropped lines are expected'});
 $('stop-python').click();$('reset').click();await clean();
 const diagnosticCode=Array.from({length:12},(_,i)=>'#error DIAGNOSTIC_'+i+'_'+ 'd'.repeat(2600)).join('\n')+'\nint main(){}\n';
 setCode(diagnosticCode);$('run-cpp').click();await until(()=>$('stop-python').disabled&&$('python-output').textContent.includes('DIAGNOSTIC_'),120,'real long Clang diagnostics');
 assert($('python-output').textContent.length===24000&&maxOutput<=24000,'Compiler diagnostics did not remain within the output bound');
 kept(diagnosticCode);assert(!$('run-cpp').disabled,'Compiler error disabled Run');
 await progress({case:'long real compiler diagnostics',result:'PASS',retainedCharacters:$('python-output').textContent.length,maximumObservedCharacters:maxOutput});
 // Repeated ordinary button clicks replace the active run; only the final reference may execute.
 setCode(reference);$('run-cpp').click();$('run-cpp').click();$('run-cpp').click();
 await until(()=>$('python-state').textContent.includes('callbacks ready'),120,'repeated Run recovery');
 await until(()=>{$('check').click();return $('status').textContent.startsWith('Exercise complete');},20,'reference checker after diagnostics');
 assert(!$('python-output').textContent.includes('already exists'),'Repeated Run left duplicate node');kept(reference);
 $('stop-python').click();$('reset').click();await clean();
 await progress({case:'compile-error recovery and three immediate Run clicks',result:'PASS',sharedChecker:true,refresh:false});
 // Thousands of genuine declarations keep the compiler busy long enough to observe its stage.
 // No worker instrumentation, artificial pause or mocked compiler is used.
 const heavy='#include <rclcpp/rclcpp.hpp>\n'+Array.from({length:5000},(_,i)=>'int compilation_probe_'+i+'(int x){return x+'+i+';}').join('\n')+'\nint main(){rclcpp::init();auto node=std::make_shared<rclcpp::Node>("compile_should_not_finish");rclcpp::spin(node);}\n';
 for(const action of ['stop-python','reset']){
  setCode(heavy);$('run-cpp').click();await until(()=>$('python-state').textContent==='Compiling C++…',120,'real compiler stage');
  const stage=$('python-state').textContent;$(action).click();await clean();
  const stoppedState=$('python-state').textContent,stoppedOutput=$('python-output').textContent;
  await wait(1000);await clean();
  assert($('python-state').textContent===stoppedState&&$('python-output').textContent===stoppedOutput,'Cancelled compilation emitted stale status/output');
  kept(heavy);await progress({case:action==='reset'?'Reset during actual compilation':'Stop during actual compilation',result:'PASS',observedStage:stage,staleActivity:false});
 }
 setCode(reference);$('run-cpp').click();await until(()=>$('python-state').textContent.includes('callbacks ready'),120,'final recovery');
 await until(()=>{$('check').click();return $('status').textContent.startsWith('Exercise complete');},20,'final reference checker');kept(reference);
 $('stop-python').click();$('reset').click();await clean();assert(maxOutput<=24000,'Output cap violated');
 await progress({case:'real compile/run/check after both cancellations',result:'PASS',refresh:false});
 window.cppUIStressResults=results;
 out.textContent='PASS: real 1000-line output and long compiler diagnostics bounded to 24000 characters; repeated Run, Stop/Reset during compilation and recovery without refresh';
}catch(error){out.textContent='FAIL: '+error.message;}finally{observer?.disconnect();if($&&!$('stop-python').disabled)$('stop-python').click();}
await fetch('/done',{method:'POST',body:out.textContent});
</script>
