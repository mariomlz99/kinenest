<!doctype html><meta charset="utf-8"><title>Session 3 integration test</title><pre id="result">RUNNING</pre><img src="/hold" alt=""><iframe src="../session-03.html" width="1400" height="1700"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.getElementById('result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(check,seconds=20){for(let i=0;i<seconds*10;i++){if(check())return;await wait(100);}throw new Error('Timed out: '+frame.contentDocument?.getElementById('python-state')?.textContent+' '+frame.contentDocument?.getElementById('python-output')?.textContent);}
fetch('/progress',{method:'POST',body:'Harness started'});
try{
 await until(()=>frame.contentDocument?.getElementById('lesson-select')?.disabled===false);
 const d=frame.contentDocument,$=id=>d.getElementById(id);
 for(let index=0;index<6;index++){
   $('lesson-select').selectedIndex=index;$('lesson-select').dispatchEvent(new Event('change'));
   await until(()=>d.body.dataset.lessonState==='ready'&&$('lesson-number').textContent==='EXERCISE 3.'+(index+1));
   $('python-code').value=await (await fetch('./python/solution-'+(index+1)+'.py')).text();$('run-python').click();
   await until(()=>$('python-state').textContent.includes('callbacks ready'),90);
   await wait(index===5?6500:1000);$('check').click();
   if(index===2||index===3)await until(()=>!$('check').disabled,20);
   if(!$('status').textContent.startsWith('Exercise complete'))throw new Error('Exercise '+(index+1)+' failed: '+$('feedback').textContent+' '+$('python-output').textContent);
   result.textContent+='\nPASS exercise '+(index+1);await fetch('/progress',{method:'POST',body:'PASS exercise '+(index+1)});
 }
 // Accept a different node structure, names and cv2-style algorithm.
 $('lesson-select').selectedIndex=3;$('lesson-select').dispatchEvent(new Event('change'));
 await until(()=>d.body.dataset.lessonState==='ready'&&$('lesson-number').textContent==='EXERCISE 3.4');
 $('python-code').value=await (await fetch('./python/alternative-position.py')).text();$('run-python').click();
 await until(()=>$('python-state').textContent.includes('callbacks ready'),60);$('check').click();await until(()=>!$('check').disabled,20);
 if(!$('status').textContent.startsWith('Exercise complete'))throw new Error('Alternative cv2 implementation rejected: '+$('feedback').textContent);
 // A constant detector must fail the varied-scene test.
 $('lesson-select').selectedIndex=2;$('lesson-select').dispatchEvent(new Event('change'));
 await until(()=>d.body.dataset.lessonState==='ready'&&$('lesson-number').textContent==='EXERCISE 3.3');
 let code=await (await fetch('./python/solution-3.py')).text();$('python-code').value=code.replace('report_detection(mask.sum() > 500)','report_detection(True)');$('run-python').click();
 await until(()=>$('python-state').textContent.includes('callbacks ready'),60);$('check').click();await until(()=>!$('check').disabled,20);
 if($('status').textContent.startsWith('Exercise complete'))throw new Error('Hard-coded detector passed');
 // Stop must recover even from an infinite Python loop and leave no student node.
 $('python-code').value='while True: pass';$('run-python').click();await until(()=>$('python-state').textContent==='Python executing…',60);await wait(200);$('stop-python').click();
 if(!$('python-state').textContent.includes('stopped'))throw new Error('Stop did not terminate Python');
 $('reset').click();
 result.textContent='PASS: all six real-Pyodide exercises, alternative cv2 solution, hard-coded negative control, stop and reset';
}catch(error){result.textContent='FAIL: '+error.message;}
await fetch('/done',{method:'POST',body:result.textContent});
</script>
