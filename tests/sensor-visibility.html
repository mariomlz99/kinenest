<!doctype html><meta charset="utf-8"><title>Sensor visibility across the course</title>
<pre id="result">RUNNING</pre><img src="/hold" hidden alt=""><iframe width="1450" height="1100"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),result=document.getElementById('result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(check,seconds=20){for(let i=0;i<seconds*10;i++){if(check())return;await wait(100);}throw Error('Timed out in '+frame.contentDocument?.body?.dataset.lessonId+' at '+frame.contentDocument?.getElementById('output')?.textContent.slice(-500));}
function image(canvas){return canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;}
function differs(a,b){for(let i=0;i<a.length;i+=4)if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2])return true;return false;}
try{
 let lessons=0;
 for(let session=2;session<=6;session++){
  frame.src='../session-0'+session+'.html';
  await until(()=>frame.contentDocument?.body?.dataset.lessonState==='ready'&&frame.contentDocument?.body?.dataset.session===String(session));
  const d=frame.contentDocument,$=id=>d.getElementById(id);
  if(session===3&&!$('map').closest('details')?.open)throw Error('Session 3 LiDAR map starts hidden');
  for(const id of [...$('lesson-select').options].map(option=>option.value)){
   $('lesson-select').value=id;$('lesson-select').dispatchEvent(new Event('change'));
   await until(()=>d.body.dataset.lessonState==='ready'&&d.body.dataset.lessonId===id);
   if(!$('graph').textContent.includes('/simulator → /scan')||!$('graph').textContent.includes('/simulator → /camera/image_raw'))throw Error('Sensor publishers missing in '+id);
   const map=$('map'),rays=$('show-rays');rays.checked=true;await wait(180);const on=image(map);
   rays.checked=false;await wait(180);const off=image(map);
   if(!differs(on,off))throw Error('LiDAR toggle has no visible effect in '+id);
   rays.checked=true;
   const input=$('command'),output=$('output');
   for(const [topic,field,expected] of [
    ['/scan','range_max','\n10\n---'],
    ['/camera/image_raw','width','\n320\n---'],
    ['/odom','child_frame_id','\n"base_link"\n---'],
    ['/tf','transforms.1.child_frame_id','\n"base_link"\n---']
   ]){
    const start=output.textContent.length;
    input.value='ros2 topic echo '+topic+' --field '+field+' --once';input.closest('form').requestSubmit();
    await until(()=>output.textContent.slice(start).includes(expected)&&!input.readOnly);
   }
   lessons++;
  }
  await fetch('/progress',{method:'POST',body:'PASS sensor visibility and live topics in Session '+session});
 }
 result.textContent='PASS: visible LiDAR rays and live scan/camera/odom/TF topics in '+lessons+' exercises';
}catch(error){result.textContent='FAIL: '+error.message;}
await fetch('/done',{method:'POST',body:result.textContent});
</script>
