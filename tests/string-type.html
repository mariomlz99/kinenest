<!doctype html><meta charset="utf-8"><body><pre id="result">RUNNING</pre><img src="/hold" alt=""><iframe src="../session-02.html"></iframe><script type="module">
const f=document.querySelector('iframe'),wait=ms=>new Promise(r=>setTimeout(r,ms));let result;
try{for(let i=0;i<300;i++){if(f.contentDocument?.getElementById('run-python')?.disabled===false)break;await wait(100);}const d=f.contentDocument;d.getElementById('python-code').value="import rclpy\nfrom std_msgs.msg import String\nrclpy.init()\nnode=rclpy.create_node('string_reader')\npub=node.create_publisher(String, '/words', 10)\ndef receive(msg):\n    assert isinstance(msg.data, str) and msg.data == 'Infinity'\n    print('STRING_OK')\nnode.create_subscription(String, '/words', receive, 10)\nnode.create_timer(0.2, lambda: pub.publish(String(data='Infinity')))\nrclpy.spin(node)";d.getElementById('run-python').click();let passed=false;for(let i=0;i<900;i++){if(d.getElementById('python-output').textContent.includes('STRING_OK')){passed=true;break;}await wait(100);}if(!passed)throw Error(d.getElementById('python-output').textContent);d.getElementById('stop-python').click();result='PASS: String payload Infinity remains a Python string';}catch(e){result='FAIL: '+e.message;}document.getElementById('result').textContent=result;await fetch('/done',{method:'POST',body:result});</script>
