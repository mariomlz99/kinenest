<!doctype html><meta charset="utf-8"><img src="/hold" hidden alt=""><pre id="result">RUNNING</pre><iframe width="1440" height="1100" src="../session-02.html"></iframe><script type="module">
const f=document.querySelector('iframe'),out=document.getElementById('result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
async function until(fn,seconds=90){for(let i=0;i<seconds*10;i++){if(fn())return;await wait(100);}throw Error('Timeout '+f.contentDocument?.body?.dataset.lessonId+' '+f.contentDocument?.getElementById('python-output')?.textContent);}
const assert=(v,m)=>{if(!v)throw Error(m);};
try{
 await until(()=>f.contentDocument?.body?.dataset.lessonState==='ready');
 let d=f.contentDocument;const $=id=>d.getElementById(id);
 const choose=async id=>{$('lesson-select').value=id;$('lesson-select').dispatchEvent(new Event('change'));await until(()=>d.body.dataset.lessonState==='ready'&&d.body.dataset.lessonId===id);};
 const cases=[['session-02-01-subscriber','2.1'],['session-02-02-callbacks','2.2'],['session-02-03-sectors','2.3'],['session-02-04-avoidance','2.4'],['session-06-01-topic-debug','6.1']];
 let debugSource;
 for(const [id,label]of cases){
  if(id.startsWith('session-06-')){const previous=d;f.src='../session-06.html';await until(()=>f.contentDocument!==previous&&f.contentDocument?.body?.dataset.lessonState==='ready');d=f.contentDocument;}
  else if(d.body.dataset.lessonId!==id)await choose(id);
  assert(new URL(f.contentWindow.location.href).searchParams.get('lesson')===id,'Lesson URL must identify the selected exercise '+id);
  assert(d.body.dataset.lessonId===id,'Wrong loaded lesson '+id);
  for(const mode of ['python','cpp','compare'])assert(!d.querySelector('[data-code-language="'+mode+'"]').hidden,'Missing public mode '+mode+' '+label);
  d.querySelector('[data-code-language="compare"]').click();$('python-code').value='# retained draft';
  const response=await fetch('./cpp/course/'+id+'.cpp');assert(response.ok,'Reference fetch '+id);
  $('cpp-code').value=await response.text();const source=$('cpp-code').value;
  $('run-cpp').click();await until(()=>$('python-state').textContent.includes('callbacks ready'));
  await until(()=>{$('check').click();return $('status').textContent.startsWith('Exercise complete');});
  assert($('python-code').value==='# retained draft','Python draft changed '+label);
  $('language').value='it';$('language').dispatchEvent(new Event('change'));$('theme').click();$('layout').value='stack';$('layout').dispatchEvent(new Event('change'));await wait(100);
  assert(!$('stop-python').disabled,'Preferences stopped C++ '+label);assert($('python-code').value==='# retained draft'&&$('cpp-code').value===source,'Preferences lost drafts '+label);
  $('reset').click();assert($('stop-python').disabled,'Reset did not terminate C++ '+label);
  assert(!$('graph').textContent.includes('/student_controller')&&!$('graph').textContent.includes('/scan_reader'),'Reset kept endpoint '+label);
  assert($('cpp-code').value===source&&$('python-code').value==='# retained draft','Reset erased drafts '+label);
  $('language').value='en';$('language').dispatchEvent(new Event('change'));
  if(label==='6.1')debugSource=source;
  await fetch('/progress',{method:'POST',body:'PASS public C++ exercise '+label});
 }
 d.querySelector('[data-code-language="cpp"]').click();
 await choose('session-06-02-frame-debug');
 for(const mode of ['python','cpp','compare'])assert(!d.querySelector('[data-code-language="'+mode+'"]').hidden,'Missing public frame-debug mode '+mode);
 assert(d.querySelector('[data-code-language="cpp"]').getAttribute('aria-pressed')==='true'&&!$('run-cpp').disabled,'Frame-debug exercise lost preferred C++');
 $('cpp-code').value='// retained frame-debug draft';$('python-code').value='# retained frame-debug draft';
 await choose('session-06-01-topic-debug');
 assert($('cpp-code').value===debugSource&&$('python-code').value==='# retained draft','Supported round trip lost topic-debug drafts');
 assert(d.querySelector('[data-code-language="cpp"]').getAttribute('aria-pressed')==='true','Supported round trip lost language preference');
 await choose('session-06-02-frame-debug');
 assert($('cpp-code').value==='// retained frame-debug draft'&&$('python-code').value==='# retained frame-debug draft','Supported round trip lost frame-debug drafts');
 out.textContent='PASS: ordinary URLs compile/run C++ 2.1–2.4 and 6.1, shared checkers, Compare drafts, language/theme/layout, Reset and public 6.2 draft round trip';
}catch(e){out.textContent='FAIL: '+e.message;}
await fetch('/done',{method:'POST',body:out.textContent});
</script>
