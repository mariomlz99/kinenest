<!doctype html><meta charset="utf-8"><img src="/hold" hidden alt=""><pre id="result">RUNNING</pre><iframe width="1400" height="1000"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.getElementById('result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const expected={
 en:'Made with love in Belgium 🇧🇪 by Mario Malizia, an 🇮🇹 soul, with development assistance from ChatGPT by OpenAI.',
 nl:'Met liefde gemaakt in België 🇧🇪 door Mario Malizia, met een 🇮🇹 ziel, met ontwikkelhulp van ChatGPT van OpenAI.',
 fr:'Créé avec amour en Belgique 🇧🇪 par Mario Malizia, à l’âme 🇮🇹, avec l’aide au développement de ChatGPT par OpenAI.',
 es:'Hecho con amor en Bélgica 🇧🇪 por Mario Malizia, de alma 🇮🇹, con ayuda en el desarrollo de ChatGPT de OpenAI.',
 de:'Mit Liebe in Belgien 🇧🇪 entwickelt von Mario Malizia, mit 🇮🇹 Seele, mit Entwicklungsunterstützung durch ChatGPT von OpenAI.',
 pt:'Feito com amor na Bélgica 🇧🇪 por Mario Malizia, de alma 🇮🇹, com apoio ao desenvolvimento de ChatGPT da OpenAI.',
 it:'Realizzato con amore in Belgio 🇧🇪 da Mario Malizia, dall’anima 🇮🇹, con il supporto allo sviluppo di ChatGPT di OpenAI.'
};
const flagLabels={en:'Italian',nl:'Italiaans',fr:'italienne',es:'italiana',de:'italienisch',pt:'italiana',it:'italiana'};
const contactLabels={en:'Questions?',nl:'Vragen?',fr:'Des questions ?',es:'¿Preguntas?',de:'Fragen?',pt:'Dúvidas?',it:'Domande?'};
try{for(const page of ['index.html','session-01.html','session-02.html','session-03.html','session-04.html','session-05.html','session-06.html','bridge.html','about.html','licences.html','real-ros.html']){
 localStorage.setItem('ros2learn-language','en');await new Promise(resolve=>{frame.onload=resolve;frame.src='../'+page;});let d;
 for(let i=0;i<150;i++){d=frame.contentDocument;if(d?.getElementById('language')&&d?.querySelector('footer .attribution'))break;await wait(50);}
 const support=d.querySelector('footer a.support-link');if(support?.href!=='https://buymeacoffee.com/mariomlz99'||support.target!=='_blank'||!['noopener','noreferrer'].every(x=>support.relList.contains(x))||!support.querySelector('svg'))throw Error('Support link '+page);
 if([...d.scripts].some(s=>/buymeacoffee/i.test(s.src)))throw Error('Support widget loaded');
 const l=d.getElementById('language');if(!l)throw Error('Language selector missing on '+page+' (boot '+d.documentElement.dataset.kinenestBoot+')');
 for(const lang of Object.keys(expected)){
  l.value=lang;l.dispatchEvent(new Event('change'));await wait(30);
  const p=d.querySelector('footer .attribution'),text=p?.textContent.replace(/\s+/g,' ').trim();
  if(text!==expected[lang]||p.lang!==lang)throw Error('Attribution '+page+' '+lang+': '+text);
  const italian=p.querySelector('[role="img"]');if(italian?.textContent!=='🇮🇹'||italian.getAttribute('aria-label')!==flagLabels[lang])throw Error('Italian flag label '+page+' '+lang);
  for(const [label,url]of [['Mario Malizia','https://www.linkedin.com/in/mario-malizia/'],['ChatGPT','https://chatgpt.com/'],['OpenAI','https://openai.com/']])if(![...p.querySelectorAll('a')].some(a=>a.textContent===label&&a.href===url))throw Error('Footer link '+page+' '+lang+' '+label);
  const contact=d.querySelector('footer .footer-contact'),link=contact?.querySelector('a');
  if(contact?.querySelector('span')?.textContent!==contactLabels[lang]||link?.getAttribute('href')!=='mailto:hello@kinenest.com'||link.textContent!=='hello@kinenest.com')throw Error('Contact link '+page+' '+lang);
 }
 if(page==='about.html'){for(let i=0;i<100&&!d.getElementById('build-info').textContent.includes('Commit:');i++)await wait(50);if(!d.getElementById('build-info').textContent.includes('Commit:'))throw Error('About build identity missing');}
}out.textContent='PASS: translated attribution, links and contact in seven languages on all eleven public pages';}catch(e){out.textContent='FAIL: '+e.message;}await fetch('/done',{method:'POST',body:out.textContent});
</script>
