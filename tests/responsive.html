<!doctype html><html><meta charset="utf-8"><title>KineNest responsive regression</title><pre id="result">RUNNING</pre><img src="/hold" alt=""><iframe title="Course under test" width="1440" height="844"></iframe><script type="module">
const frame=document.querySelector('iframe'),out=document.getElementById('result'),wait=ms=>new Promise(r=>setTimeout(r,ms));
const assert=(v,m)=>{if(!v)throw Error(m);};
async function ready(){for(let i=0;i<200;i++){const d=frame.contentDocument;if(d?.documentElement.dataset.kinenestBoot==='ready')return d;await wait(50);}throw Error('Page not ready');}
async function load(page){frame.src='../'+page;await new Promise(r=>frame.onload=r);return ready();}
async function width(w){frame.width=w;await wait(60);}
function fits(d,label){assert(d.documentElement.scrollWidth<=d.documentElement.clientWidth+1,label+' horizontal page overflow');}
try{
 localStorage.setItem('ros2learn-language','en');localStorage.setItem('ros2learn-theme','light');
 for(const page of ['index.html','session-01.html','session-02.html','session-03.html','session-04.html','session-05.html','session-06.html','about.html','licences.html','real-ros.html']){
  const d=await load(page);for(const lang of ['en','nl','fr','es','de','pt','it']){const language=d.getElementById('language');language.value=lang;language.dispatchEvent(new Event('change'));for(const w of [320,768,1440]){await width(w);fits(d,page+' header '+lang+' '+w);const tagline=d.querySelector('.brand-tagline');assert(tagline?.textContent.trim().length>20,'Global tagline missing');assert(frame.contentWindow.getComputedStyle(tagline).visibility==='visible','Tagline hidden');} }for(const w of [320,360,375,390,430,600,768,820,1024,1280,1366,1440,1920]){await width(w);fits(d,page+' '+w);}
 }
 let landing=await load('index.html');for(const w of [320,360,375,390,430,600,768,1024,1440,1920]){frame.height=w===320?568:w===375?667:844;await width(w);fits(landing,'Landing '+w);assert(landing.querySelector('.start-course').getBoundingClientRect().bottom<=Number(frame.height),'Start action below initial phone viewport');}let d=await load('session-02.html');await width(390);
 const style=e=>frame.contentWindow.getComputedStyle(e),$=id=>d.getElementById(id);
 $('python-code').value='# preserved draft';d.querySelector('[data-code-language="compare"]').click();$('cpp-code').value='// preserved draft';
 for(const lang of ['en','nl','fr','es','de','pt','it']){
  $('language').value=lang;$('language').dispatchEvent(new Event('change'));await wait(60);fits(d,'Compare '+lang);
  assert($('python-code').value==='# preserved draft'&&$('cpp-code').value==='// preserved draft','Translation erased drafts');
  for(const e of [$('python-code'),$('cpp-code'),$('lesson-select'),d.querySelector('.terminal input')])assert(parseFloat(style(e).fontSize)>=16,'Mobile editable text too small: '+e.id+' '+style(e).fontSize);
 }
 const py=$('python-code').getBoundingClientRect(),cpp=$('cpp-code').getBoundingClientRect();assert(cpp.top>=py.bottom,'Compare does not stack');assert(py.width>200&&cpp.width>200,'Editors too narrow');
 for(const button of d.querySelectorAll('.code-languages button'))assert(button.getBoundingClientRect().height>=44,'Code mode touch target');
 const color=style($('editor-help')).color;const rgb=color.match(/[\d.]+/g).slice(0,3).map(Number),lin=rgb.map(v=>{v/=255;return v<=.04045?v/12.92:((v+.055)/1.055)**2.4;}),lum=lin.reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);assert(1.05/(lum+.05)>=4.5,'Light editor help contrast');
 assert($('python-code').getAttribute('autocapitalize')==='off'&&$('cpp-code').getAttribute('autocorrect')==='off','Code input assistance may alter source');
 $('language').value='en';$('language').dispatchEvent(new Event('change'));await wait(50);assert(d.querySelector('.code-support').textContent.includes('60 MB'),'Compiler size notice missing');
 for(const lines of [10,40,100]){for(const editor of [$('python-code'),$('cpp-code')]){editor.value=Array.from({length:lines},(_,i)=>'line_'+i+' = '+('long_identifier_'.repeat(12))).join('\n');assert(editor.getBoundingClientRect().height>=360,'Long source collapsed editor');assert(editor.scrollWidth>editor.clientWidth,'Long lines should scroll inside editor');}fits(d,'Source length '+lines);}
 out.textContent='PASS: 360 responsive cases including ten pages, seven-language headers, phone landing and Compare, preserved drafts, readable editable text and help, touch targets, no overflow';
}catch(e){out.textContent='FAIL: '+e.message;}await fetch('/done',{method:'POST',body:out.textContent});
</script></html>
