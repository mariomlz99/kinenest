<!doctype html>
<meta charset="utf-8">
<title>KineNest C++ parity UI acceptance</title>
<img src="/hold" hidden alt="">
<pre id="result">RUNNING</pre>
<iframe width="1440" height="1100" title="KineNest course under test"></iframe>
<script type="module">
const frame = document.querySelector('iframe');
const out = document.getElementById('result');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const assert = (value, message) => { if (!value) throw Error(message); };
const wave = new URLSearchParams(location.search).get('wave') || '9';
const ids = [
  'session-02-01-subscriber', 'session-02-02-callbacks', 'session-02-03-sectors', 'session-02-04-avoidance',
  'session-03-01-camera-subscriber', 'session-03-02-image-data', 'session-03-03-color-detection',
  'session-03-04-object-position', 'session-03-05-services', 'session-03-06-target-challenge',
  'session-04-01-configure', 'session-04-02-tuning', 'session-04-03-custom',
  'session-04-04-goal', 'session-04-05-feedback', 'session-04-06-cancel',
  'session-05-01-odometry', 'session-05-02-heading', 'session-05-03-frames',
  'session-05-04-relative', 'session-05-05-goal', 'session-05-06-safety',
  'session-06-01-topic-debug', 'session-06-02-frame-debug', 'session-06-03-beacon'
];
const waves = {
  4: ids.slice(10, 13), 5: ids.slice(16, 18),
  6: [...ids.slice(18, 22), ids[23]],
  7: ids.slice(13, 16), 8: [ids[24]], 9: ids
};
const representative = new Set([
  ids[1], ids[5], ids[8], ids[11], ids[14], ids[17], ids[20], ids[24]
]);
let d, currentSession, activeLesson;
const $ = id => d.getElementById(id);
const results = [];
window.cppParityUIResults = results;

async function until(predicate, seconds = 90, description = 'condition') {
  for (let i = 0; i < seconds * 10; ++i) {
    if (predicate()) return;
    await wait(100);
  }
  throw Error('Timeout waiting for ' + description + ' / ' +
    frame.contentDocument?.body?.dataset.lessonId + ' / ' +
    frame.contentDocument?.getElementById('status')?.textContent + ' / ' +
    frame.contentDocument?.getElementById('python-state')?.textContent + ' / ' +
    frame.contentDocument?.getElementById('python-output')?.textContent);
}

async function get(url) {
  const response = await fetch(url, {signal: AbortSignal.timeout(20000)});
  assert(response.ok, 'Fetch failed: ' + url + ' (' + response.status + ')');
  return response;
}

function event(type) { return new frame.contentWindow.Event(type, {bubbles: true, cancelable: true}); }
function mode(name) {
  const button = d.querySelector('[data-code-language="' + name + '"]');
  assert(button && !button.hidden, 'Missing public language mode ' + name + ' / ' + activeLesson);
  button.click();
}
function edit(id, value) { $(id).value = value; $(id).dispatchEvent(event('input')); }
function preference(id, value) { $(id).value = value; $(id).dispatchEvent(event('change')); }
function assertDrafts(python, cpp, label) {
  assert($('python-code').value === python && $('cpp-code').value === cpp, 'Lost drafts: ' + label);
}
function pose() {
  const match = $('pose').textContent.match(/x\s+(-?[\d.]+)\s+m.*?y\s+(-?[\d.]+)\s+m.*?yaw\s+(-?[\d.]+)\s+rad/);
  assert(match, 'Cannot read visible pose: ' + $('pose').textContent);
  return {x: Number(match[1]), y: Number(match[2]), yaw: Number(match[3])};
}
function nodeList() {
  $('output').textContent = '';
  $('command').value = 'ros2 node list';
  $('terminal-form').dispatchEvent(event('submit'));
  return $('output').textContent.split('\n').map(line => line.trim()).filter(line => line.startsWith('/')).sort().join('\n');
}
function command(text) {
  $('output').textContent = '';
  $('command').value = text;
  $('terminal-form').dispatchEvent(event('submit'));
  const output = $('output').textContent;
  assert(!/Error:|Unknown command|Traceback/.test(output), 'CLI failed: ' + text + ' / ' + output);
  return output;
}

async function load(id) {
  activeLesson = id;
  const session = id.slice(8, 10);
  if (currentSession !== session) {
    const previous = frame.contentDocument;
    frame.src = '../session-' + session + '.html';
    await until(() => frame.contentDocument !== previous &&
      frame.contentDocument?.body?.dataset.lessonState === 'ready' &&
      frame.contentDocument?.documentElement.dataset.kinenestBoot === 'ready', 45, 'new session boot');
    d = frame.contentDocument;
    currentSession = session;
  }
  assert(!frame.contentWindow.location.search, 'Acceptance requires ordinary URLs');
  preference('language', 'en');
  preference('layout', 'split');
  if (d.body.dataset.lessonId !== id) {
    preference('lesson-select', id);
    await until(() => d.body.dataset.lessonState === 'ready' && d.body.dataset.lessonId === id, 30, 'exercise selection');
  }
  assert(d.body.dataset.lessonId === id, 'Unexpected exercise loaded');
  const boot = d.querySelector('script[src*="session3-boot.js"]');
  assert(boot, 'Missing versioned session boot script');
  const lessonURL = new URL('../../public/lessons/' + id + '.json', boot.src);
  const lesson = await (await get(lessonURL)).json();
  assert(lesson.programming.cpp.supported, 'C++ not publicly supported: ' + id);
  for (const language of ['python', 'cpp', 'compare']) {
    const button = d.querySelector('[data-code-language="' + language + '"]');
    assert(button && !button.hidden, 'Missing public ' + language + ' / ' + id);
  }
  return lesson;
}

async function phoneCheck() {
  frame.width = 390;
  mode('compare');
  await wait(180);
  const py = $('python-code').getBoundingClientRect();
  const cpp = $('cpp-code').getBoundingClientRect();
  assert(cpp.top >= py.bottom - 1, 'Phone Compare must stack / ' + activeLesson);
  assert(py.width >= 200 && cpp.width >= 200, 'Phone editor too narrow / ' + activeLesson);
  assert(d.documentElement.scrollWidth <= d.documentElement.clientWidth + 1, 'Phone page overflow / ' + activeLesson);
  for (const element of [$('run-python'), $('run-cpp'), $('stop-python'), $('check'), $('reset'),
    ...d.querySelectorAll('.code-languages button')]) {
    const rect = element.getBoundingClientRect();
    assert(rect.width > 0 && rect.left >= -1 && rect.right <= d.documentElement.clientWidth + 1,
      'Phone control outside viewport: ' + element.id + ' / ' + activeLesson);
  }
  frame.width = 1440;
  await wait(100);
}

async function draftCycle(lesson, python, cpp) {
  mode('python'); edit('python-code', python);
  mode('cpp'); edit('cpp-code', cpp);
  mode('compare');
  const initialPose = $('pose').textContent;
  for (const language of ['en', 'nl', 'fr', 'es', 'de', 'pt', 'it']) {
    preference('language', language);
    mode('cpp');
    await wait(30);
    assertDrafts(python, cpp, activeLesson + ' / ' + language);
    assert(d.documentElement.lang === language, 'UI language not applied');
    const content = lesson.programming.cpp.content;
    if (content) {
      const translated = language === 'en' ? content : content.translations?.[language];
      assert(translated?.title && translated.steps?.length && translated.hints?.length, 'Missing C++ content: ' + activeLesson + ' / ' + language);
      assert($('mission-title').textContent === translated.title, 'Wrong C++ task title: ' + activeLesson + ' / ' + language);
    }
    mode('python');
    await wait(30);
    const translatedPython = language === 'en' ? lesson : lesson.translations[language];
    assert($('mission-title').textContent === translatedPython.title, 'Python task title not restored');
    assertDrafts(python, cpp, 'Python restore / ' + language);
  }
  mode('compare');
  $('theme').click();
  preference('layout', 'stack');
  await wait(100);
  assert($('pose').textContent === initialPose, 'Preferences reset the idle world');
  assertDrafts(python, cpp, 'theme/layout');
  if (representative.has(activeLesson)) await phoneCheck();
  mode('python');
  assertDrafts(python, cpp, 'complete draft cycle');
  preference('language', 'en');
  preference('layout', 'split');
  $('theme').click();
  mode('compare');
}

async function run() {
  mode('compare');
  assert(!$('run-cpp').disabled, 'Run C++ disabled');
  $('run-cpp').click();
  await until(() => $('python-state').textContent.includes('callbacks ready'), 120, 'real compilation and execution');
  assert(!$('stop-python').disabled, 'C++ not stoppable after startup');
}

async function checkWhenReady(lesson) {
  if (lesson.testScenes) {
    // Exactly one click: this starts the real asynchronous varied-scene detector check.
    $('check').click();
    await until(() => $('check').disabled, 3, 'scene checker start');
    await until(() => !$('check').disabled, 25, 'scene checker completion');
    assert($('status').textContent.startsWith('Exercise complete'), 'Varied-scene check failed: ' + $('feedback').textContent);
    return;
  }
  if (activeLesson === 'session-04-02-tuning') {
    await wait(1400);
    command('ros2 param set /student_controller speed 0.6');
    await wait(1100);
  } else if (/session-04-0[456]-/.test(activeLesson)) {
    await until(() => /Result code:|Cancelled:/.test($('python-output').textContent), 35, 'action result callback');
  } else if (lesson.goal && /session-05-0[56]-|session-06-02-/.test(activeLesson)) {
    let stableSince = 0, previous = '';
    await until(() => {
      const current = pose();
      const close = Math.hypot(current.x - lesson.goal[0], current.y - lesson.goal[1]) < 0.11;
      const key = current.x + ',' + current.y + ',' + current.yaw;
      if (!close || previous !== key) stableSince = 0;
      previous = key;
      if (close && !stableSince) stableSince = performance.now();
      return close && performance.now() - stableSince > 750;
    }, 75, 'stable physical goal pose before Check');
  } else if (/session-02-04-|session-06-01-/.test(activeLesson)) {
    await wait(8500);
  } else {
    await wait(1200);
  }
  await until(() => {
    $('check').click();
    return $('status').textContent.startsWith('Exercise complete');
  }, 60, 'shared behavioral success');
}

async function cleanup(expectedGraph, expectedNodes, label) {
  await until(() => $('stop-python').disabled && $('graph').textContent === expectedGraph, 6, label + ' graph paint cleanup');
  assert(nodeList() === expectedNodes, label + ' leaked a node');
  if (activeLesson.startsWith('session-04-')) {
    assert(!command('ros2 param list').includes('/student_controller'), label + ' leaked parameter bindings');
    assert(!command('ros2 action info /drive_distance').includes('/student_controller'), label + ' leaked action client');
  }
}

try {
  assert(waves[wave], 'Unknown parity wave: ' + wave);
  for (const id of waves[wave]) {
    const started = performance.now();
    const lesson = await load(id);
    $('reset').click();
    await wait(160);
    const baselineGraph = $('graph').textContent, baselineNodes = nodeList(), initialPose = pose();
    const source = await (await get('./cpp/course/' + id + '.cpp')).text();
    const python = '# Independent Python draft ' + lesson.number + '\nprint("draft preserved")\n';
    await draftCycle(lesson, python, source);
    await run();
    await checkWhenReady(lesson);
    assertDrafts(python, source, 'real C++ run');

    preference('language', 'it');
    $('theme').click();
    preference('layout', 'stack');
    mode('cpp'); mode('compare'); mode('python'); mode('compare');
    await wait(100);
    assert(!$('stop-python').disabled, 'Preferences/editor switch stopped the active C++ run');
    assertDrafts(python, source, 'preferences while running');
    preference('language', 'en');
    $('theme').click();
    preference('layout', 'split');

    $('stop-python').click();
    await cleanup(baselineGraph, baselineNodes, 'Stop');
    assertDrafts(python, source, 'Stop');
    // Reset is also exercised against a newly running program, not only after Stop.
    await run();
    $('reset').click();
    await cleanup(baselineGraph, baselineNodes, 'Reset');
    await wait(350);
    const resetPose = pose();
    assert(Math.hypot(resetPose.x - initialPose.x, resetPose.y - initialPose.y) < 0.02 &&
      Math.abs(resetPose.yaw - initialPose.yaw) < 0.02, 'Reset failed to restore or hold the initial world');
    assertDrafts(python, source, 'Reset');

    // Representative API families also switch exercise while the worker is active.
    // Other cases retain the stopped round trip without an unnecessary third compile.
    const alternative = [...$('lesson-select').options].find(option => option.value !== id)?.value;
    const activeSwitch = representative.has(id) && !!alternative;
    if (alternative) {
      if (activeSwitch) {
        await run();
        assert(!$('stop-python').disabled, 'Representative switch did not start from active C++');
      }
      mode('cpp');
      preference('lesson-select', alternative);
      await until(() => d.body.dataset.lessonState === 'ready' && d.body.dataset.lessonId === alternative, 30, 'adjacent exercise');
      if (activeSwitch) {
        await cleanup(baselineGraph, baselineNodes, 'Active exercise switch');
        const adjacentPose = $('pose').textContent;
        const adjacentOutput = $('python-output').textContent;
        const adjacentState = $('python-state').textContent;
        await wait(900);
        assert($('stop-python').disabled && $('graph').textContent === baselineGraph,
          'Old C++ endpoints or execution returned after exercise switch');
        assert($('pose').textContent === adjacentPose, 'Stale commands moved the adjacent exercise world');
        assert($('python-output').textContent === adjacentOutput && $('python-state').textContent === adjacentState,
          'Late C++ output or execution state reached the adjacent exercise');
        assert(nodeList() === baselineNodes, 'Old C++ node returned after exercise switch');
      }
      preference('lesson-select', id);
      await until(() => d.body.dataset.lessonState === 'ready' && d.body.dataset.lessonId === id, 30, 'exercise return');
      assertDrafts(python, source, 'exercise round trip');
      assert(d.querySelector('[data-code-language="cpp"]').getAttribute('aria-pressed') === 'true', 'Lost C++ editor preference');
      if (activeSwitch) {
        const returnedPose = $('pose').textContent;
        await wait(700);
        assert($('stop-python').disabled && $('pose').textContent === returnedPose,
          'Stale C++ execution survived return to the original exercise');
        assertDrafts(python, source, 'active exercise return');
      }
    }
    const row = {exercise: lesson.number, id, compile: true, run: true, check: true, drafts: true, stop: true, reset: true,
      responsive: representative.has(id), activeExerciseSwitch: activeSwitch, durationMs: Math.round(performance.now() - started), result: 'pass'};
    results.push(row);
    await fetch('/progress', {method: 'POST', body: 'PASS C++ parity UI ' + lesson.number + ' · drafts, physical checker, Stop/Reset'});
  }
  out.textContent = 'PASS: C++ parity UI wave ' + wave + ' · ' + results.length + ' exercises; ordinary URLs, real compilation, shared checks, seven languages, independent drafts, Stop/Reset and phone Compare';
} catch (error) {
  results.push({id: activeLesson, result: 'fail', error: error.message});
  out.textContent = 'FAIL: ' + error.message;
}
const artifact = document.createElement('script');
artifact.type = 'application/json';
artifact.id = 'cpp-parity-ui-results';
artifact.textContent = JSON.stringify({wave, results});
document.body.append(artifact);
await fetch('/done', {method: 'POST', body: out.textContent});
</script>
