<!doctype html>
<meta charset="utf-8">
<title>KineNest C++ toolchain network recovery</title>
<img src="/hold" hidden alt="">
<pre id="result">RUNNING</pre>
<iframe width="1440" height="1100" title="Course under network fault test"></iframe>
<script type="module">
const out=document.getElementById('result'),frame=document.querySelector('iframe');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
async function until(predicate,seconds=120){for(let i=0;i<seconds*10;i++){if(predicate())return;await wait(100);}throw Error('Timed out: '+frame.contentDocument?.getElementById('python-output')?.textContent);}
let win,RealWorker,blobURL;
try{
 frame.src='../session-02.html';
 await until(()=>frame.contentDocument?.body?.dataset.lessonState==='ready'&&frame.contentDocument?.documentElement.dataset.kinenestBoot==='ready');
 const d=frame.contentDocument;win=frame.contentWindow;RealWorker=win.Worker;
 const $=id=>d.getElementById(id),event=()=>new win.Event('input',{bubbles:true});
 d.querySelector('[data-code-language="cpp"]').click();
 assert(d.querySelector('.code-support').textContent.includes('60 MB'),'Missing first-download notice');
 const response=await fetch('./cpp/course/session-02-01-subscriber.cpp');assert(response.ok,'Reference missing');
 const code=await response.text();$('cpp-code').value=code;$('cpp-code').dispatchEvent(event());
 // Inject a real fetch failure inside the actual production worker. No compiler
 // output or successful execution is mocked. A fresh cache view forces first-load behavior.
 win.Worker=function(url,options){
  if(!new URL(url,win.location.href).pathname.endsWith('/cpp/worker.js'))return new RealWorker(url,options);
  const original=String(url);
  const bootstrap='const held=[];self.onmessage=e=>held.push(e);const request=fetch.bind(self);'+
   'self.fetch=(input,init)=>String(input).startsWith("https://raw.githubusercontent.com/binji/wasm-clang/")?Promise.reject(new TypeError("Controlled toolchain network outage")):request(input,init);'+
   'Object.defineProperty(self,"caches",{value:{open:async()=>({match:async()=>undefined,put:async()=>{}})}});'+
   'await import('+JSON.stringify(original)+');const handler=self.onmessage;for(const event of held)handler(event);';
  blobURL=URL.createObjectURL(new Blob([bootstrap],{type:'text/javascript'}));
  return new RealWorker(blobURL,{...options,type:'module'});
 };
 $('run-cpp').click();
 await until(()=>$('python-output').textContent.includes('Controlled toolchain network outage')&&$('stop-python').disabled);
 assert($('cpp-code').value===code,'Network failure lost student source');
 assert($('python-output').textContent.includes('Check your connection and run again'),'Network error lacks recovery guidance');
 assert(win.localStorage.getItem('kinenest-cpp-download-notice-seen')==='1','Explicit Run did not acknowledge download notice');
 assert(!d.getElementById('graph').textContent.includes('student_controller'),'Failed load left a student endpoint');
 assert(!$('run-cpp').disabled,'Network failure left Run disabled');
 win.Worker=RealWorker;URL.revokeObjectURL(blobURL);blobURL=null;
 $('run-cpp').click();
 await until(()=>$('python-state').textContent.includes('callbacks ready'));
 await until(()=>{$('check').click();return $('status').textContent.startsWith('Exercise complete');},20);
 assert($('cpp-code').value===code,'Recovery lost student source');
 $('stop-python').click();$('reset').click();
 // A truncated cached response and denied cache write must still allow a real
 // fresh toolchain fetch and compilation. No successful compiler output is mocked.
 win.Worker=function(url,options){
  if(!new URL(url,win.location.href).pathname.endsWith('/cpp/worker.js'))return new RealWorker(url,options);
  const bootstrap='const held=[];self.onmessage=e=>held.push(e);'+
   'Object.defineProperty(self,"caches",{value:{open:async()=>({match:async()=>new Response(new Uint8Array([0])),delete:async()=>true,put:async()=>{throw new Error("Controlled storage quota failure");}})}});'+
   'await import('+JSON.stringify(String(url))+');const handler=self.onmessage;for(const event of held)handler(event);';
  blobURL=URL.createObjectURL(new Blob([bootstrap],{type:'text/javascript'}));
  return new RealWorker(blobURL,{...options,type:'module'});
 };
 $('run-cpp').click();
 await until(()=>$('python-state').textContent.includes('callbacks ready'));
 await until(()=>{$('check').click();return $('status').textContent.startsWith('Exercise complete');},20);
 assert($('cpp-code').value===code,'Cache recovery lost student source');
 assert(!d.querySelector('.code-support').textContent.includes('60 MB'),'Acknowledged notice repeated');
 $('stop-python').click();$('reset').click();
 win.Worker=RealWorker;URL.revokeObjectURL(blobURL);blobURL=null;
 out.textContent='PASS: real network failure and truncated cache preserve source; fresh fetch compiles/runs/checks despite cache quota failure; first-download notice acknowledged';

}catch(error){out.textContent='FAIL: '+error.message;}
finally{if(win&&RealWorker)win.Worker=RealWorker;if(blobURL)URL.revokeObjectURL(blobURL);}
await fetch('/done',{method:'POST',body:out.textContent});
</script>
