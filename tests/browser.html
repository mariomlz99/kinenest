<!doctype html><meta charset="utf-8"><title>KineCourse browser smoke test</title><pre id="result">RUNNING</pre><img src="/hold" alt=""><iframe width="1200" height="1100"></iframe><script type="module">
const frame=document.querySelector('iframe'),result=document.querySelector('#result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw new Error(message);};
try {
// Use a deterministic animation clock: headless virtual time does not drive rAF.
const html=await (await fetch('../')).text();
frame.srcdoc=html.replace('<head>','<head><base href="../"><script>window.requestAnimationFrame=callback=>setTimeout(()=>callback(performance.now()),1000/60);<'+ '/script>');
for(let i=0;i<100;i++){if(frame.contentDocument?.querySelector('#command')?.disabled===false)break;await wait(50);}
const d=frame.contentDocument,$=id=>d.getElementById(id);
assert($('command')&&!$('command').disabled,'Lesson did not load');
const command=text=>{$('command').value=text;$('terminal-form').requestSubmit();};
command('ros2 node list');assert($('output').textContent.includes('/simulator'),'Node missing');
command('ros2 topic list');assert($('output').textContent.includes('/cmd_vel'),'Topic missing');
command('ros2 topic type /cmd_vel');assert($('output').textContent.includes('geometry_msgs/msg/Twist'),'Type missing');
command('ros2 topic pub --once /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.6}}"');
await wait(3000);$('check').click();
assert($('status').textContent.startsWith('Exercise complete'),'Motion/check failed: '+$('distance').textContent);
assert($('feedback').querySelectorAll('.pass').length===3,'Expected three passing checks');
$('hint').click();assert($('hints').children.length===1,'Hint missing');
$('reset').click();$('check').click();assert($('feedback').querySelectorAll('.fail').length===3,'Reset failed');assert($('distance').textContent==='0.00 m','Distance not reset');assert($('hints').children.length===0,'Hints not reset');
command('bad command');assert($('output').textContent.includes('Unsupported command'),'Error missing');
const second=d.querySelector('[data-terminal="2"]');
const runIn=(panel,text)=>{panel.querySelector('input').value=text;panel.querySelector('form').requestSubmit();};
runIn(second,'ros2 topic echo /odom --field pose.pose.position');
assert(second.querySelector('input').readOnly,'Echo did not occupy terminal');
$('add-terminal').click();const third=d.querySelector('[data-terminal="3"]');
assert(third,'Third terminal missing');runIn(third,'ros2 topic echo /cmd_vel');
command('ros2 topic pub --once /cmd_vel geometry_msgs/msg/Twist "{linear: {x: 0.6}}"');
await wait(2500);
assert(second.querySelector('pre').textContent.includes('x: 1.2'),'Odometry did not update');
assert(third.querySelector('pre').textContent.includes('x: 0.6'),'Cross-terminal Twist missing');
third.querySelector('input').dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{key:'c',ctrlKey:true,bubbles:true}));
assert(!third.querySelector('input').readOnly,'Ctrl+C did not stop echo');
command('ros2 topic info /cmd_vel');assert($('output').textContent.endsWith('Subscription count: 1\n'),'Echo subscriber leaked');
second.querySelector('.stop-echo').click();assert(!second.querySelector('input').readOnly,'Stop echo failed');
runIn(third,'ros2 topic echo /odom');third.querySelector('.close-terminal').click();
assert(!d.querySelector('[data-terminal="3"]'),'Close failed');
command('ros2 topic info /odom');assert($('output').textContent.endsWith('Subscription count: 0\n'),'Close leaked subscription');
runIn(second,'ros2 topic echo /odom');$('reset').click();
assert(!second.querySelector('input').readOnly,'Reset left echo running');
const resetOutput=second.querySelector('pre').textContent;await wait(400);
assert(second.querySelector('pre').textContent===resetOutput,'Messages arrived after reset');
result.textContent='PASS: original lab and multiple terminals, live odometry/Twist, Ctrl+C, stop, close, reset';
}catch(error){result.textContent='FAIL: '+error.message;}
await fetch('/done',{method:'POST',body:result.textContent}).catch(()=>{});
</script>
