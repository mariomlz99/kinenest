<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Lesson loading regression</title>
<img src="/hold" hidden alt=""><pre id="result">Testing delayed lesson responses…</pre>
<iframe src="../session-05.html" title="Session 5" width="1400" height="1000"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),result=document.getElementById('result');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(fn){for(let i=0;i<200;i++){if(fn())return;await wait(50);}throw Error('Lesson did not become ready');}
function assert(value,message){if(!value)throw Error(message);}
try{
  // The server deliberately delays lesson JSON to make the startup race repeatable.
  await until(()=>frame.contentDocument?.getElementById('lesson-select')?.disabled===false);
  const d=frame.contentDocument,$=id=>d.getElementById(id),select=$('lesson-select');
  assert(!$('run-python').disabled,'Selector enabled before the first lesson was ready');
  assert($('python-code').value.length>0,'First lesson has no starter code');
  const first=select.value,second=select.options[1].value,code='# keep this draft during reload';
  $('python-code').value=code;
  // Reselecting the same lesson must still wait for its asynchronous reset.
  select.dispatchEvent(new Event('change'));
  assert(select.disabled&&$('run-python').disabled&&$('check').disabled,'Lesson controls stayed active during loading');
  $('run-python').click();
  await until(()=>!select.disabled);
  assert(d.body.dataset.lessonId===first&&d.body.dataset.lessonState==='ready','Incorrect readiness state');
  assert($('python-code').value===code,'Reload discarded the student draft');
  assert($('python-state').textContent==='Python stopped','Run started while the lesson was loading');
  // Even overlapping programmatic selections must finish on the latest request.
  select.value=second;select.dispatchEvent(new Event('change'));
  select.value=first;select.dispatchEvent(new Event('change'));
  await until(()=>!select.disabled);
  assert(d.body.dataset.lessonId===first&&$('python-code').value===code,'A stale response replaced the selected lesson');
  result.textContent='PASS: delayed initial load, same-lesson reload, disabled Run, preserved draft and latest selection';
}catch(error){result.textContent='FAIL: '+error.message;}
await fetch('/done',{method:'POST',body:result.textContent});
</script></html>
