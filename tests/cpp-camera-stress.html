<!doctype html><html lang="en"><meta charset="utf-8"><title>Real slow C++ camera callbacks</title><pre id="result">RUNNING</pre><img src="/hold" hidden alt=""><script type="module">
const out=document.getElementById('result'),wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const assert=(value,message)=>{if(!value)throw Error(message);};
const html=await(await fetch('../session-03.html')).text();
const path=new DOMParser().parseFromString(html,'text/html').querySelector('script[src$="session3-boot.js"]').getAttribute('src').replace('ui/session3-boot.js','');
const {Runtime}=await import('../'+path+'runtime/graph.js'),{CppBridge}=await import('../'+path+'cpp/bridge.js'),{setParameter}=await import('../'+path+'runtime/course.js');
const runtime=new Runtime();runtime.enableSession3();let output='',state='',metrics={},previousMs=0,previousFrames=0,sampling=false,callbackMs=[],memory=[],replaced=0,maxInFlight=0,maxPending=0,generation;
const bridge=new CppBridge(runtime,{output:text=>output+=text+'\n',status:text=>state=text,metrics:value=>{
 if(sampling&&value.imageFrames>previousFrames){callbackMs.push(value.imageCallbackMs-previousMs);memory.push(value.programMemoryBytes);}
 previousMs=value.imageCallbackMs??0;previousFrames=value.imageFrames??0;metrics=value;
}});
const offer=bridge.mailbox.offer;bridge.mailbox.offer=function(key,deliver){
 if(sampling&&this.inFlight.has(key)&&this.latest.has(key))replaced++;
 const result=offer.call(this,key,deliver);if(sampling){maxInFlight=Math.max(maxInFlight,this.inFlight.size);maxPending=Math.max(maxPending,this.latest.size);}return result;
};
async function until(test,seconds=120){for(let i=0;i<seconds*50;i++){if(test())return;if(output.includes('C++:')||output.includes('C++ worker:'))throw Error(output);await wait(20);}throw Error('Timeout '+state+' '+output);}
async function progress(text){out.textContent=text;await fetch('/progress',{method:'POST',body:text});}
try{
 const source=await(await fetch('./cpp/camera-stress.cpp')).text();
 bridge.run(source);await until(()=>state.includes('callbacks ready'));
 let iterations=500000,elapsed=0;const calibration=[];
 for(let attempt=0;attempt<7;attempt++){
  setParameter(runtime,'/camera_stress','work',iterations);
  const count=metrics.imageFrames??0,total=metrics.imageCallbackMs??0;runtime.step(.125);
  await until(()=>(metrics.imageFrames??0)>count&&bridge.mailbox.inFlight.size===0,5);
  elapsed=metrics.imageCallbackMs-total;calibration.push({iterations,callbackMs:elapsed});
  assert(elapsed<2000,'Calibration exceeded 2 seconds');
  if(elapsed>=200&&elapsed<=700)break;
  iterations=Math.max(1,Math.min(500000000,Math.round(iterations*Math.min(8,320/Math.max(.1,elapsed)))));
 }
 assert(elapsed>=200&&elapsed<=700,'Could not calibrate genuine slow callback: '+JSON.stringify(calibration));
 await progress('CALIBRATED actual WASM loop '+JSON.stringify(calibration));
 const firstFrame=runtime.frameId,firstProcessed=metrics.imageFrames;const started=performance.now();sampling=true;
 generation=setInterval(()=>runtime.step(.125),125);await wait(6000);clearInterval(generation);generation=null;
 const latest=runtime.frameId,generated=latest-firstFrame,elapsedGeneration=performance.now()-started;
 await until(()=>bridge.mailbox.inFlight.size===0&&bridge.mailbox.latest.size===0,5);sampling=false;
 const processed=metrics.imageFrames-firstProcessed;
 assert(generated>=35,'Main thread did not sustain camera cadence');
 assert(bridge.processed.has(latest),'Newest camera frame did not drain');
 assert(maxInFlight===1&&maxPending===1,'Queue exceeded one active plus one latest');
 assert(replaced>0&&processed<generated,'Slow callback did not exercise latest-frame replacement');
 assert(generated-processed===replaced,'Frame accounting mismatch');
 const sorted=[...callbackMs].sort((a,b)=>a-b),median=sorted[Math.floor(sorted.length/2)];
 assert(median>125,'Callbacks were not actually slower than the sensor period');
 assert(Math.max(...callbackMs)<2000,'Callback exceeded 2 seconds');
 assert(memory.length>=5&&Math.max(...memory)===Math.min(...memory),'WASM linear memory did not remain stable');
 assert(output.length<4096,'Unexpected output growth');
 const result={kind:'sustained actual WASM callback work',sensorPeriodMs:125,generationMs:Math.round(elapsedGeneration),calibration,iterations,generated,processed,replaced,maxInFlight,maxPending,newestFrame:latest,newestDrained:true,medianCallbackMs:median,maxCallbackMs:Math.max(...callbackMs),wasmLinearMemoryBytes:memory[0],memorySamples:memory.length,note:'Real callback computation; no clock_time_get, fake worker delay, or synthetic frame burst. WASM linear memory is not total browser memory.'};
 await progress('METRICS '+JSON.stringify(result));
 // The calibrated callback is real WASM computation. Stop before it completes,
 // with another real camera frame waiting in the latest-sample mailbox.
 const beforeFrames=metrics.imageFrames,beforeCallbacks=runtime.evidence.callbacks;
 const beforeProcessed=bridge.processed.size,beforeReports=bridge.reports.size;
 runtime.step(.125);const interruptedFrame=runtime.frameId;
 await wait(100);
 assert(metrics.imageFrames===beforeFrames&&runtime.evidence.callbacks===beforeCallbacks,'Slow callback completed before mid-callback Stop');
 assert(bridge.worker&&bridge.mailbox.inFlight.size===1,'Expected actual callback in flight at Stop');
 runtime.step(.125);const discardedFrame=runtime.frameId;
 assert(bridge.mailbox.latest.size===1,'Expected latest real frame waiting at Stop');
 const stoppedAt=performance.now();bridge.stop();
 const stoppedOutput=output,stoppedState=state;
 const clean=()=>{
  assert(!bridge.worker&&bridge.nodes.size===0&&bridge.subscriptions.size===0&&bridge.jobs.size===0,'Stop left worker or runtime registrations');
  assert(bridge.mailbox.inFlight.size===0&&bridge.mailbox.latest.size===0,'Stop left pending camera mailbox');
  assert(!runtime.nodes.has('/camera_stress')&&!runtime.parameters.has('/camera_stress'),'Stop left node or parameters');
  assert(!runtime.parameterListeners.has(bridge.parameterListener),'Stop left parameter update listener');
  for(const topic of runtime.topics.values())assert(!topic.publishers.has('/camera_stress')&&!topic.subscribers.has('/camera_stress'),'Stop left graph endpoint');
 };
 clean();
 // Keep producing real sensor samples after disposal: none may reach the old worker.
 for(let i=0;i<10;i++){runtime.step(.125);await wait(125);clean();}
 assert(metrics.imageFrames===beforeFrames&&runtime.evidence.callbacks===beforeCallbacks,'Stopped callback added evidence');
 assert(bridge.processed.size===beforeProcessed&&bridge.reports.size===beforeReports,'Stopped callback changed report history');
 assert(!bridge.processed.has(interruptedFrame)&&!bridge.processed.has(discardedFrame),'Stopped or queued frame was processed');
 assert(output===stoppedOutput&&state===stoppedState,'Stopped worker produced stale output or status');
 await progress('MID_CALLBACK_STOP '+JSON.stringify({interruptedFrame,discardedFrame,callbackIncompleteAtMs:100,observationMs:Math.round(performance.now()-stoppedAt),endpointsCleared:true,mailboxCleared:true,noLateEvidence:true}));
 runtime.reset();clean();
 assert(runtime.evidence.callbacks===0&&!runtime.evidence.dimensions&&!runtime.evidence.converted,'Reset retained camera exercise evidence');
 bridge.run(source);
 assert(bridge.processed.size===0&&bridge.reports.size===0,'Rerun retained previous frame evidence');
 await until(()=>state.includes('callbacks ready'));
 setParameter(runtime,'/camera_stress','work',500000);
 const rerunFrames=metrics.imageFrames??0;runtime.step(.125);
 await until(()=>(metrics.imageFrames??0)>rerunFrames&&bridge.mailbox.inFlight.size===0,5);
 assert(runtime.evidence.callbacks===1&&runtime.evidence.converted,'Rerun did not process fresh image data');
 bridge.stop();runtime.reset();clean();assert(runtime.evidence.callbacks===0,'Final Reset retained callback evidence');
 out.textContent='PASS: sustained 8 Hz camera with actual slow C++ callbacks, bounded queue, newest drain, stable WASM memory, mid-callback Stop without stale evidence, Reset and real rerun';
}catch(error){out.textContent='FAIL: '+error.message;}finally{clearInterval(generation);bridge.stop();}
await fetch('/done',{method:'POST',body:out.textContent});
</script></html>
