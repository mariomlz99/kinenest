name: Validate and publish KineNest
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kinenest-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Real browser runtimes
        run: npm run test:browser
      - name: BASICS and product acceptance
        run: |
          PORT=8018 npm run preview > /tmp/kinenest-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:8018/build-info.json && break || sleep 1; done
          SITE_URL=http://127.0.0.1:8018/ npm run test:product
          LAB_URL=http://127.0.0.1:8018/basics.html npm run test:acceptance
          LAB_LANGUAGE=cpp LAB_URL=http://127.0.0.1:8018/basics.html npm run test:acceptance
          LAB_URL=http://127.0.0.1:8018/basics.html npm run test:actions
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
